<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera IA Local</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h2>🤖 Asistente Virtual IA</h2>
        </div>
        <div class="chat-box" id="chatBox">
            <!-- Los mensajes aparecerán aquí -->
            <div class="message ai-message">¡Hola! Soy tu IA local. Escribe algo para empezar a conversar.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Escribe tu mensaje aquí..." autocomplete="off">
            <button id="sendBtn">Enviar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
